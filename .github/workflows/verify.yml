# Reusable verify workflow (design record D6, contract C2).
# Callers pin it by full commit SHA from a `pull_request` workflow; see
# templates/repo/.github/workflows/agent-verify.yml.
#
# Job `run` builds and drives the candidate with a read-only token and no secrets.
# Job `attest` never touches PR code; it alone holds id-token and attestations write.
name: agent-kit verify

on:
  workflow_call:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Require a pull_request event
        if: github.event_name != 'pull_request'
        run: |
          echo "agent-kit verify runs only from a pull_request workflow" >&2
          exit 1

      - name: Check out the kit at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kit
          persist-credentials: false

      - name: Fetch the repo history (base and head are exported by the kit, not built here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      - name: Run base journeys, data assertions and regression specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KIT_SHA: ${{ job.workflow_sha }}
          KIT_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: >-
          python3 kit/verify/local_run.py
          --repo repo --base "$BASE_SHA" --head "$HEAD_SHA"
          --out "$RUNNER_TEMP/evidence" --work "$RUNNER_TEMP/agent-kit"
          --repo-name "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --kit-ref "$KIT_SHA" --workflow-ref "$KIT_WORKFLOW_REF"
          --isolation container --install-browsers

      - name: Upload evidence and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-kit-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the kit at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kit
          persist-credentials: false

      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-kit-evidence
          path: evidence

      - name: Validate evidence against the schema, this run and the artifact hashes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KIT_SHA: ${{ job.workflow_sha }}
          KIT_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: >-
          python3 kit/verify/evidence.py evidence/evidence.json --artifacts-dir evidence
          --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA"
          --kit-ref "$KIT_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --workflow-ref "$KIT_WORKFLOW_REF"

      - name: Attest evidence.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: evidence/evidence.json
